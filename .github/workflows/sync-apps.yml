name: Sync WinUI Apps & Contributors

on:
  # 1. Scheduled run every 6 hours (fallback if webhook/dispatch isn't triggered)
  schedule:
    - cron: '0 */6 * * *'
  # 2. Triggered instantly when WinUI-Apps-List fires a repository_dispatch event
  repository_dispatch:
    types: [upstream-apps-updated]
  # 3. Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fluentdeck repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync latest apps and contributors data
        run: npm run sync:data

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/apps-data.json public/data/contributors.json public/assets/apps/ public/assets/contributors/
          if git diff --staged --quiet; then
            echo "No changes detected from upstream sync."
          else
            git commit -m "chore(data): sync latest WinUI apps and contributors from upstream"
            git push
          fi

